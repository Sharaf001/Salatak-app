name: Salatak release checks

on:
  workflow_dispatch:
    inputs:
      build_preview:
        description: Build the EAS preview after the release gates
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/salatak test
      - run: pnpm --filter @workspace/salatak exec npx expo-doctor
      - run: pnpm --filter @workspace/salatak exec expo install --check
      - name: Report content sizes
        run: |
          quran_bytes=$(wc -c < artifacts/salatak/data/quran-verses.json)
          wallpaper_bytes=$(find artifacts/salatak/assets/wallpapers -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          app_bytes=$(find artifacts/salatak -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          echo "quran-verses.json: ${quran_bytes} bytes"
          echo "wallpapers: ${wallpaper_bytes} bytes"
          echo "artifacts/salatak: ${app_bytes} bytes"

  preview-build:
    if: ${{ github.event_name == 'push' || inputs.build_preview == true }}
    needs: release-gates
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: ${{ env.EXPO_TOKEN != '' }}
        run: pnpm dlx eas-cli build --profile preview --platform all --non-interactive
