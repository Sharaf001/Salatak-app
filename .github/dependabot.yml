version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: expo*
      - dependency-name: '@expo/*'
      - dependency-name: react-native*
    groups:
      javascript-minor-patch:
        update-types:
          - minor
          - patch
