kind = "mobile"
previewPath = "/"
title = "Salatak / صلاتك"
description = "A mobile Islamic companion for prayer times, Quran reading, bookmarks, Hijri dates, rak'ah counting, and daily supplications."
version = "1.0.0"
id = "artifacts/salatak"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19812

[services.development]
run = "pnpm --filter @workspace/salatak run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/salatak", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/salatak", "run", "serve" ]

[services.env]
PORT = "19812"
BASE_PATH = "/"
